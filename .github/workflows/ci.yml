#
# The same four OTP/Elixir legs as beam_mcp (floor, pinned, head, box): the OTP floor
# (tools/otp_floor.sh), format, compile with warnings as errors, Credo --strict (.credo.exs),
# the Hex audit (retired packages and OSV advisories against mix.lock), the suite; the REUSE
# lint over the tree; and the DCO sign-off on every commit, as beam_mcp's gate workflow checks
# it. Actions pinned by commit SHA with the version beside it.
#
# THE BOX LEG: the pair a fielded edge box runs (OTP 28 at a patched release, Elixir 1.20) on
# the architecture it runs on (aarch64, GitHub's arm64 runner, free for public repositories),
# over the OpenSSL line the box's image pins (3.5 or later, which ML-DSA needs): Ubuntu 26.04's
# runner ships 3.5.5, and builds.hex.pm's OTP for it links that, where 24.04's links 3.0.13.
# The leg sets MLDSA_REQUIRED, so an OTP without ML-DSA-87 is a red leg (tools/mldsa_offered.sh).
# Its versions are exact (`version-type: strict`), not "the newest 28": the box pins its
# runtime, so the leg does too. Every leg runs the OTP floor step, so a resolution below a
# line's patched floor (tools/otp-floors, CVE-2026-55737) is a red leg, not a green one on a
# vulnerable runtime.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (OTP ${{ matrix.otp }}, Elixir ${{ matrix.elixir }}, ${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: floor,  otp: "27", elixir: "1.17", os: ubuntu-24.04, version-type: loose, mldsa: "0" }
          - { leg: pinned, otp: "28", elixir: "1.18", os: ubuntu-24.04, version-type: loose, mldsa: "0" }
          - { leg: head,   otp: "29", elixir: "1.20", os: ubuntu-24.04, version-type: loose, mldsa: "0" }
          - { leg: box,    otp: "28.5.0.8", elixir: "1.20.4", os: ubuntu-26.04-arm, version-type: strict, mldsa: "1" }
    env:
      MIX_ENV: test
      MLDSA_REQUIRED: ${{ matrix.mldsa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
          version-type: ${{ matrix.version-type }}
      # Also printed on every leg: the OpenSSL `:crypto` is linked to and whether it offers
      # ML-DSA-87; asserted where the leg sets MLDSA_REQUIRED (the box leg).
      - name: the pair setup-beam installed, at or above its line's patched OTP floor
        run: |
          erl -noshell -eval 'io:format("~s~n", [erlang:system_info(system_version)]), halt().'
          elixir --version | tail -1
          bash tools/mldsa_offered.sh
          bash tools/otp_floor.sh
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix credo --strict
      - run: mix hex.audit
      - run: mix test
      # The hash envelope's done-when: a 10 GiB file (sparse, so no disk is written) signed in
      # constant memory and verified holding only the digest and the signature, its digest held
      # to sha384sum's (test/beam_mcp/signer/cose_hash_envelope_ten_gb_test.exs).
      - name: a 10 GiB file signed in constant memory (hash envelope)
        if: matrix.leg == 'box'
        run: mix test --only ten_gb
      # The box leg's ML-DSA-87 signature, N6 carrier and hash envelope, for the cross-verify job
      # to check with implementations outside Elixir (tools/mldsa_sample.exs; the key pair is a
      # published ACVP test vector).
      - name: an ML-DSA-87 signature for other implementations to verify
        if: matrix.leg == 'box'
        run: mix run tools/mldsa_sample.exs mldsa87-sample
      # Recorded, not asserted: a shared runner's latency is the runner's, never a box's figure.
      # 2,000 rounds per size, so the printed p99.9 is a percentile and not the maximum.
      - name: ML-DSA-87 latency on this runner (recorded, no threshold)
        if: matrix.leg == 'box'
        run: mix run tools/bench_mldsa.exs 2000
      - if: matrix.leg == 'box'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mldsa87-sample
          path: mldsa87-sample/
          if-no-files-found: error
          retention-days: 7

  # BeamMCP.Signer.MLDSA87's output, verified by two ML-DSA implementations other than the
  # OpenSSL that made it: Go's crypto/mldsa (which also derives the public key from the seed,
  # as OTP cannot) and AWS-LC through aws-lc-rs. Each must accept the signature and refuse it
  # over the message with one bit flipped; then read the N6 carrier and the hash envelope with
  # its own CBOR and COSE code, build ToBeSigned itself and verify (tools/cross_verify/).
  cross-verify:
    name: ML-DSA-87 cross-verify (Go crypto/mldsa, aws-lc-rs)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mldsa87-sample
          path: mldsa87-sample
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: Go crypto/mldsa, and the N6 carrier and hash envelope read with fxamacker/cbor
        working-directory: tools/cross_verify/go
        run: go run . "$GITHUB_WORKSPACE/mldsa87-sample"
      - name: aws-lc-rs, and the N6 carrier and hash envelope read with coset and ciborium (the toolchain and every crate pinned)
        working-directory: tools/cross_verify/rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          RUSTFLAGS="-D warnings" cargo +1.92.0 run --locked --release -- "$GITHUB_WORKSPACE/mldsa87-sample"


  reuse:
    name: REUSE lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: every file carries copyright and licence information (the version beam_mcp pins)
        run: pipx run reuse==6.2.0 lint

  dco:
    name: DCO sign-off
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: every commit in the range carries a Signed-off-by
        run: |
          set -uo pipefail
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}..HEAD"
            git rev-list --no-merges "$range" > /tmp/commits \
              || { echo "cannot resolve $range"; exit 1; }
          elif [ -z "$before" ] \
            || [ "$before" = "0000000000000000000000000000000000000000" ] \
            || ! git rev-parse --verify --quiet "$before^{commit}" >/dev/null; then
            # Two cases, one fallback. A branch's first push has no previous state, so
            # github.event.before is the all-zeros SHA. A force-push names a real-looking SHA
            # that is no longer reachable -- dropping a commit leaves `before` pointing at
            # something the fetched history does not contain. Testing the SHA's SHAPE catches
            # only the first; asking git whether it RESOLVES catches both.
            echo "before is unusable ('$before'): checking every commit reachable from HEAD"
            git rev-list --no-merges HEAD > /tmp/commits \
              || { echo "cannot list commits from HEAD"; exit 1; }
          else
            range="$before..HEAD"
            git rev-list --no-merges "$range" > /tmp/commits \
              || { echo "cannot resolve $range"; exit 1; }
          fi
          echo "commits in scope: $(wc -l < /tmp/commits)"
          fail=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if git log -1 --format='%B' "$sha" | grep -q '^Signed-off-by: '; then
              echo "  ok   $sha"
            else
              echo "  FAIL $sha carries no Signed-off-by"; fail=1
            fi
          done < /tmp/commits
          exit $fail
